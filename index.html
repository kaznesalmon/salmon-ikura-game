<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>鮭イクラキャノン</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#0c4778;touch-action:none;color:#fff}
canvas{display:block;width:100vw;height:100vh;background:#0c4778}
#hud{position:fixed;top:10px;left:12px;right:12px;z-index:3;display:flex;justify-content:space-between;gap:12px;font-weight:900;font-size:clamp(16px,4.5vw,24px);color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.5);pointer-events:none}
#staminaWrap{position:fixed;top:48px;left:12px;right:12px;z-index:3;pointer-events:none}
#staminaLabel{display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:4px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
#staminaTrack{height:12px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35)}
#staminaBar{height:100%;width:100%;background:#76e6a2}
#tip{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:3;background:rgba(255,255,255,.95);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap;color:#345}
#menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(0,20,40,.58);padding:20px}
.box{width:min(90vw,440px);padding:26px 22px;background:#fff;color:#123;border-radius:24px;text-align:center;box-shadow:0 15px 50px rgba(0,0,0,.35)}
h1{margin:0 0 10px;font-size:29px}
p{color:#506777;line-height:1.6;margin:8px 0 20px}
button{border:0;border-radius:999px;padding:15px 30px;background:#ff7048;color:#fff;font-size:20px;font-weight:900;box-shadow:0 5px #c34c2e}
button:active{transform:translateY(3px);box-shadow:0 2px #c34c2e}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><span>🐟 鮭イクラキャノン</span><span>⭐ <span id="score">0</span>　🔥 <span id="combo">0</span>　❤️ <span id="life">3</span></span></div>
<div id="staminaWrap"><div id="staminaLabel"><span>🥚 イクラスタミナ</span><span><span id="staminaText">100</span>/100</span></div><div id="staminaTrack"><div id="staminaBar"></div></div></div>
<div id="tip">上下スライドで移動 / 長押しで連射</div>
<div id="menu"><div class="box"><h1 id="title">🐟 鮭イクラキャノン</h1><p id="text">12球団をイメージした動物ターゲットを撃破！<br>動物ごとに速さ・耐久力・得点が違います。</p><button id="startBtn" type="button">ゲーム開始！</button></div></div>
<script>
(() => {
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score"),comboEl=document.getElementById("combo"),lifeEl=document.getElementById("life"),staminaText=document.getElementById("staminaText"),staminaBar=document.getElementById("staminaBar"),menu=document.getElementById("menu"),titleEl=document.getElementById("title"),textEl=document.getElementById("text"),startBtn=document.getElementById("startBtn");
let W=0,H=0,D=1,running=false,score=0,combo=0,life=3,last=0,spawnTimer=0,comboTimer=0,stamina=100,firing=false,dragging=false,lastShot=0;
let eggs=[],targets=[],particles=[],floatTexts=[];
const MAX_STAMINA=100,SHOT_COST=8,STAMINA_REGEN=22,FIRE_INTERVAL=.14,COMBO_WINDOW=1.6;
const player={x:72,y:215,targetY:215,minY:135,maxY:330};
const muzzleYOffset=14;
const targetTypes=[
{symbol:"兎",label:"うさぎ",color:"#f08a2e",speed:1.35,hp:1,points:10,size:.9},
{symbol:"虎",label:"とら",color:"#e5bd27",speed:.9,hp:2,points:20,size:1.05},
{symbol:"竜",label:"りゅう",color:"#3268d2",speed:1.25,hp:1,points:15,size:1},
{symbol:"鯉",label:"こい",color:"#d94242",speed:1,hp:1,points:10,size:1},
{symbol:"燕",label:"つばめ",color:"#2f9a5f",speed:1.55,hp:1,points:20,size:.85},
{symbol:"鼠",label:"あおいこどうぶつ",color:"#4687ef",speed:1.45,hp:1,points:20,size:.75},
{symbol:"鷹",label:"たか",color:"#d8ad1f",speed:1.3,hp:1,points:15,size:.95},
{symbol:"熊",label:"くま",color:"#59b1c7",speed:.7,hp:3,points:30,size:1.2},
{symbol:"鴎",label:"かもめ",color:"#b9c4ce",speed:1.05,hp:1,points:10,size:.95},
{symbol:"獅",label:"しし",color:"#4e67d7",speed:.85,hp:2,points:20,size:1.1},
{symbol:"牛",label:"うし",color:"#a9824c",speed:.62,hp:3,points:35,size:1.25},
{symbol:"鷲",label:"わし",color:"#7b2035",speed:1.22,hp:2,points:30,size:1}
];
function resize(){D=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;canvas.width=W*D;canvas.height=H*D;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(D,0,0,D,0,0);player.minY=Math.max(130,H*.30);player.maxY=Math.min(H-95,H*.78);player.y=Math.max(player.minY,Math.min(player.maxY,player.y||H*.5));player.targetY=player.y}
window.addEventListener("resize",resize);resize();
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function multiplier(){if(combo>=20)return 5;if(combo>=15)return 4;if(combo>=10)return 3;if(combo>=5)return 2;return 1}
function refreshHUD(){scoreEl.textContent=score;comboEl.textContent=combo;lifeEl.textContent=life;stamina=Math.max(0,Math.min(MAX_STAMINA,stamina));staminaText.textContent=Math.round(stamina);staminaBar.style.width=stamina+"%"}
function drawBackground(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#0b5ca8");g.addColorStop(.62,"#1f86c7");g.addColorStop(.63,"#173e59");g.addColorStop(1,"#0d2738");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.18;ctx.fillStyle="#fff";for(let i=0;i<12;i++){ctx.beginPath();ctx.arc(30+i*(W/11),60+(i%3)*22,22,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawHero(){ctx.save();ctx.translate(player.x,player.y);ctx.fillStyle="#0c2232";roundRect(-35,-72,160,145,26);ctx.fill();ctx.strokeStyle="#1d9ac0";ctx.lineWidth=4;ctx.stroke();ctx.fillStyle="#e4a06d";ctx.beginPath();ctx.ellipse(35,-102,42,50,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#081923";ctx.beginPath();ctx.arc(35,-125,48,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(-8,-127,88,16);ctx.beginPath();ctx.moveTo(65,-116);ctx.lineTo(110,-108);ctx.lineTo(68,-102);ctx.closePath();ctx.fill();ctx.fillStyle="#fff";ctx.font="bold 25px sans-serif";ctx.fillText("F",27,-126);ctx.strokeStyle="#111";ctx.lineWidth=4;ctx.strokeRect(-2,-114,32,21);ctx.strokeRect(38,-114,32,21);ctx.beginPath();ctx.moveTo(30,-104);ctx.lineTo(38,-104);ctx.stroke();ctx.fillStyle="#111";ctx.beginPath();ctx.arc(14,-103,3.5,0,Math.PI*2);ctx.arc(54,-103,3.5,0,Math.PI*2);ctx.fill();ctx.fillStyle="#3b1914";ctx.beginPath();ctx.ellipse(34,-76,18,13,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.font="bold 17px sans-serif";ctx.fillText("FIGHTERS",-18,-8);ctx.font="bold 34px sans-serif";ctx.fillText("17",15,42);ctx.strokeStyle="#e4a06d";ctx.lineWidth=18;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(-10,5);ctx.lineTo(40,22);ctx.stroke();ctx.beginPath();ctx.moveTo(110,5);ctx.lineTo(145,-5);ctx.stroke();ctx.translate(112,-8);ctx.fillStyle="#248bc0";ctx.beginPath();ctx.ellipse(42,20,86,32,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#d9edf3";ctx.beginPath();ctx.ellipse(66,30,51,14,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#175d82";ctx.beginPath();ctx.moveTo(-32,20);ctx.lineTo(-65,-3);ctx.lineTo(-56,20);ctx.lineTo(-65,43);ctx.closePath();ctx.fill();ctx.fillStyle="#111";ctx.beginPath();ctx.arc(94,11,5,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.font="bold 15px sans-serif";ctx.fillText("FIGHTERS",-8,25);ctx.fillStyle="#2a1510";ctx.beginPath();ctx.ellipse(116,22,17,14,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function getMuzzle(){return{x:player.x+228,y:player.y+muzzleYOffset}}
function drawTarget(t){ctx.save();ctx.translate(t.x,t.y);ctx.fillStyle=t.type.color;ctx.beginPath();ctx.arc(0,0,t.r,0,Math.PI*2);ctx.fill();ctx.fillStyle="rgba(255,255,255,.9)";ctx.beginPath();ctx.arc(0,0,t.r*.74,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#17212b";ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,t.r*.92,0,Math.PI*2);ctx.stroke();ctx.fillStyle=t.type.color;ctx.font="bold "+Math.round(t.r*.9)+"px sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(t.type.symbol,0,1);if(t.maxHp>1){const bw=t.r*1.6,bh=6;ctx.fillStyle="rgba(0,0,0,.28)";ctx.fillRect(-bw/2,t.r+7,bw,bh);ctx.fillStyle="#fff";ctx.fillRect(-bw/2,t.r+7,bw*(t.hp/t.maxHp),bh)}ctx.restore()}
function drawEgg(e){ctx.fillStyle="#f27b24";ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();ctx.fillStyle="rgba(255,255,255,.85)";ctx.beginPath();ctx.arc(e.x-3,e.y-4,3,0,Math.PI*2);ctx.fill()}
function shoot(){if(!running)return false;if(stamina<SHOT_COST){firing=false;return false}stamina-=SHOT_COST;const m=getMuzzle();eggs.push({x:m.x,y:m.y,r:9,v:610});refreshHUD();return true}
function spawnTarget(){const type=targetTypes[Math.floor(Math.random()*targetTypes.length)],r=(27+Math.random()*10)*type.size,targetMinY=player.minY+muzzleYOffset,targetMaxY=player.maxY+muzzleYOffset,y=targetMinY+Math.random()*(targetMaxY-targetMinY),baseSpeed=92+Math.min(score*.28,100);targets.push({x:W+r,y,r,v:baseSpeed*type.speed,type,hp:type.hp,maxHp:type.hp})}
function burst(x,y,color){for(let i=0;i<12;i++){const a=Math.random()*Math.PI*2,s=40+Math.random()*145;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.42,color})}}
function registerKill(t){combo++;comboTimer=COMBO_WINDOW;const gain=t.type.points*multiplier();score+=gain;floatTexts.push({x:t.x,y:t.y,text:"+"+gain,life:.75});refreshHUD()}
function resetCombo(){combo=0;comboTimer=0;refreshHUD()}
function update(dt){player.y+=(player.targetY-player.y)*Math.min(1,dt*10);if(!firing&&stamina<MAX_STAMINA){stamina+=STAMINA_REGEN*dt;refreshHUD()}if(firing){lastShot+=dt;while(lastShot>=FIRE_INTERVAL){lastShot-=FIRE_INTERVAL;if(!shoot())break}}if(combo>0){comboTimer-=dt;if(comboTimer<=0)resetCombo()}spawnTimer+=dt;if(spawnTimer>Math.max(.45,1.02-score*.0011)){spawnTimer=0;spawnTarget()}eggs.forEach(e=>e.x+=e.v*dt);eggs=eggs.filter(e=>e.x<W+40);targets.forEach(t=>t.x-=t.v*dt);for(let i=targets.length-1;i>=0;i--){const t=targets[i];if(t.x-t.r<315){targets.splice(i,1);life--;resetCombo();refreshHUD();if(life<=0){gameOver();return}continue}for(let j=eggs.length-1;j>=0;j--){const e=eggs[j],dx=e.x-t.x,dy=e.y-t.y;if(dx*dx+dy*dy<(e.r+t.r)*(e.r+t.r)){eggs.splice(j,1);t.hp--;burst(e.x,e.y,t.type.color);if(t.hp<=0){registerKill(t);targets.splice(i,1)}break}}}particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=170*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);floatTexts.forEach(f=>{f.y-=28*dt;f.life-=dt});floatTexts=floatTexts.filter(f=>f.life>0)}
function draw(){drawBackground();drawHero();const m=getMuzzle();ctx.fillStyle="rgba(255,215,80,.5)";ctx.beginPath();ctx.arc(m.x,m.y,12,0,Math.PI*2);ctx.fill();eggs.forEach(drawEgg);targets.forEach(drawTarget);particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/.42);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;floatTexts.forEach(f=>{ctx.globalAlpha=Math.max(0,f.life/.75);ctx.fillStyle="#fff";ctx.font="bold 22px sans-serif";ctx.textAlign="center";ctx.fillText(f.text,f.x,f.y)});ctx.globalAlpha=1;ctx.textAlign="start";if(stamina<SHOT_COST){ctx.fillStyle="rgba(0,0,0,.30)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#fff";ctx.font="bold 27px sans-serif";ctx.textAlign="center";ctx.fillText("🥚 スタミナ回復中…",W*.63,90);ctx.textAlign="start"}}
function loop(t){if(!running)return;const dt=Math.min((t-last)/1000,.035);last=t;update(dt);draw();if(running)requestAnimationFrame(loop)}
function startGame(){running=true;score=0;combo=0;life=3;stamina=MAX_STAMINA;spawnTimer=0;comboTimer=0;firing=false;dragging=false;lastShot=0;eggs=[];targets=[];particles=[];floatTexts=[];player.y=(player.minY+player.maxY)/2;player.targetY=player.y;refreshHUD();titleEl.textContent="🐟 鮭イクラキャノン";textEl.innerHTML="12球団モチーフの動物ターゲットを撃破！<br>スタミナを管理しながら狙ってください。";startBtn.textContent="ゲーム開始！";menu.style.display="none";last=performance.now();draw();requestAnimationFrame(loop)}
function gameOver(){running=false;firing=false;dragging=false;titleEl.textContent="💥 ゲームオーバー！";textEl.innerHTML="最終スコアは <b>"+score+"点</b>！<br>もう一度挑戦しよう！";startBtn.textContent="もう一度遊ぶ";menu.style.display="flex"}
function canvasPos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function beginFire(){if(!running)return;firing=true;lastShot=FIRE_INTERVAL}
function endFire(){firing=false}
startBtn.addEventListener("click",startGame);
canvas.addEventListener("pointerdown",e=>{e.preventDefault();if(!running)return;const p=canvasPos(e);dragging=true;if(p.x<W*.58){player.targetY=clamp(p.y-muzzleYOffset,player.minY,player.maxY)}beginFire()},{passive:false});
canvas.addEventListener("pointermove",e=>{if(!dragging||!running)return;e.preventDefault();const p=canvasPos(e);if(p.x<W*.62){player.targetY=clamp(p.y-muzzleYOffset,player.minY,player.maxY)}},{passive:false});
canvas.addEventListener("pointerup",()=>{dragging=false;endFire()});
canvas.addEventListener("pointercancel",()=>{dragging=false;endFire()});
canvas.addEventListener("pointerleave",()=>{dragging=false;endFire()});
refreshHUD();draw();
})();
</script>
</body>
</html>
