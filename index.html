<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>鮭イクラキャノン・iPad操作改善版</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#0c4778;touch-action:none}
#wrap{width:100%;height:100%;display:flex;flex-direction:column;background:#fff}
#top{padding:10px 12px 6px;background:#fff;color:#17324d}
#hud{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:900;font-size:18px}
#staminaRow{margin-top:8px}
#staminaLabel{display:flex;justify-content:space-between;font-size:14px;font-weight:800}
#staminaOuter{height:14px;border-radius:999px;background:#e5e7eb;overflow:hidden;margin-top:4px}
#staminaBar{height:100%;width:100%;background:#3b82f6}
#gameBox{position:relative;flex:1;min-height:0;background:#0c4778}
canvas{display:block;width:100%;height:100%;touch-action:none;-webkit-user-drag:none}
#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,20,40,.55);padding:18px}
.card{width:min(88vw,430px);background:#fff;border-radius:24px;padding:26px 22px;text-align:center;box-shadow:0 15px 50px rgba(0,0,0,.35)}
.card h1{margin:0 0 10px;font-size:28px}.card p{margin:8px 0 20px;color:#506777;line-height:1.6}
button{border:0;border-radius:999px;padding:14px 26px;background:#ff7048;color:#fff;font-size:18px;font-weight:900;box-shadow:0 5px #c34c2e;min-height:46px}
button:active{transform:translateY(2px);box-shadow:0 3px #c34c2e}
#bottom{padding:8px 12px 12px;background:#fff;color:#506777}
#controls{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
#fireBtn{background:#17324d;box-shadow:none}
#stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.stat{border:1px solid #d8dee5;border-radius:12px;padding:8px;color:#17324d;font-size:13px}
#status{margin-top:8px;font-size:13px}
@media (max-width:600px){#hud{font-size:15px}.card h1{font-size:24px}button{font-size:17px}}
</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <div id="hud">
      <span>🐟 鮭イクラキャノン</span>
      <span>⭐ <span id="score">0</span>点　🔥 <span id="combo">0</span>　❤️ <span id="life">3</span></span>
    </div>
    <div id="staminaRow">
      <div id="staminaLabel"><span>🥚 イクラスタミナ</span><span><span id="staminaText">100</span> / 100</span></div>
      <div id="staminaOuter"><div id="staminaBar"></div></div>
    </div>
  </div>
  <div id="gameBox">
    <canvas id="gameCanvas" width="720" height="430"></canvas>
    <div id="menu">
      <div class="card">
        <h1 id="panelTitle">鮭イクラキャノン</h1>
        <p id="panelText">長押し操作をiPad向けに改善した版っす。<br>上下に動かしながらイクラを連射するっす！</p>
        <button id="startBtn" type="button">ゲーム開始</button>
      </div>
    </div>
  </div>
  <div id="bottom">
    <div id="controls">
      <span>上下スライドで移動 / 長押しで連射っす</span>
      <button id="fireBtn" type="button">🥚 長押し連射</button>
    </div>
    <div id="stats">
      <div class="stat">倍率：<b id="multiplier">×1</b></div>
      <div class="stat">次の倍率まで：<b id="nextCombo">5</b> HIT</div>
    </div>
    <div id="status">ゲーム開始を押してくださいっす</div>
  </div>
</div>
<script>
(() => {
  const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
  const menu=document.getElementById('menu'),startBtn=document.getElementById('startBtn'),fireBtn=document.getElementById('fireBtn');
  const scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),lifeEl=document.getElementById('life');
  const multiplierEl=document.getElementById('multiplier'),nextComboEl=document.getElementById('nextCombo');
  const staminaText=document.getElementById('staminaText'),staminaBar=document.getElementById('staminaBar');
  const status=document.getElementById('status'),panelTitle=document.getElementById('panelTitle'),panelText=document.getElementById('panelText');

  const W=720,H=430,MAX_STAMINA=100,SHOT_COST=8,STAMINA_REGEN=22,FIRE_INTERVAL=.14,COMBO_WINDOW=1.6;
  let running=false,score=0,life=3,last=0,spawnTime=0,raf=0,dragging=false,firing=false,lastShot=0,combo=0,comboTimer=0,stamina=100;
  let eggs=[],targets=[],sparks=[],floatTexts=[];
  const player={x:72,y:215,targetY:215,minY:135,maxY:330};
  const muzzleYOffset=14,targetMinY=149,targetMaxY=344;

  const targetTypes=[
    {symbol:'兎',label:'うさぎ',color:'#f08a2e',speed:1.35,hp:1,points:10,size:.9},
    {symbol:'虎',label:'とら',color:'#e5bd27',speed:.9,hp:2,points:20,size:1.05},
    {symbol:'竜',label:'りゅう',color:'#3268d2',speed:1.25,hp:1,points:15,size:1},
    {symbol:'鯉',label:'こい',color:'#d94242',speed:1,hp:1,points:10,size:1},
    {symbol:'燕',label:'つばめ',color:'#2f9a5f',speed:1.55,hp:1,points:20,size:.85},
    {symbol:'鼠',label:'あおいこどうぶつ',color:'#4687ef',speed:1.45,hp:1,points:20,size:.75},
    {symbol:'鷹',label:'たか',color:'#d8ad1f',speed:1.3,hp:1,points:15,size:.95},
    {symbol:'熊',label:'くま',color:'#59b1c7',speed:.7,hp:3,points:30,size:1.2},
    {symbol:'鴎',label:'かもめ',color:'#b9c4ce',speed:1.05,hp:1,points:10,size:.95},
    {symbol:'獅',label:'しし',color:'#4e67d7',speed:.85,hp:2,points:20,size:1.1},
    {symbol:'牛',label:'うし',color:'#a9824c',speed:.62,hp:3,points:35,size:1.25},
    {symbol:'鷲',label:'わし',color:'#7b2035',speed:1.22,hp:2,points:30,size:1}
  ];

  function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
  function multiplier(){if(combo>=20)return 5;if(combo>=15)return 4;if(combo>=10)return 3;if(combo>=5)return 2;return 1}
  function nextThreshold(){if(combo<5)return 5;if(combo<10)return 10;if(combo<15)return 15;if(combo<20)return 20;return 'MAX'}
  function refreshComboUI(){comboEl.textContent=combo;multiplierEl.textContent='×'+multiplier();const n=nextThreshold();nextComboEl.textContent=n==='MAX'?'MAX':Math.max(0,n-combo)}
  function refreshStamina(){stamina=clamp(stamina,0,MAX_STAMINA);staminaText.textContent=Math.round(stamina);staminaBar.style.width=stamina+'%';fireBtn.disabled=stamina<SHOT_COST;fireBtn.style.opacity=stamina<SHOT_COST?'.5':'1'}

  function drawBackground(){
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b5ca8');g.addColorStop(.62,'#1f86c7');g.addColorStop(.63,'#173e59');g.addColorStop(1,'#0d2738');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=.18;ctx.fillStyle='#fff';
    for(let i=0;i<12;i++){ctx.beginPath();ctx.arc(30+i*65,55+(i%3)*22,22,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
  }

  function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
  function drawHero(){
    ctx.save();ctx.translate(player.x,player.y);
    ctx.fillStyle='#0c2232';roundRect(-35,-72,160,145,26);ctx.fill();ctx.strokeStyle='#1d9ac0';ctx.lineWidth=4;ctx.stroke();
    ctx.fillStyle='#e4a06d';ctx.beginPath();ctx.ellipse(35,-102,42,50,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#081923';ctx.beginPath();ctx.arc(35,-125,48,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(-8,-127,88,16);ctx.fill();
    ctx.beginPath();ctx.moveTo(65,-116);ctx.lineTo(110,-108);ctx.lineTo(68,-102);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 25px sans-serif';ctx.fillText('F',27,-126);
    ctx.strokeStyle='#111';ctx.lineWidth=4;ctx.strokeRect(-2,-114,32,21);ctx.strokeRect(38,-114,32,21);ctx.beginPath();ctx.moveTo(30,-104);ctx.lineTo(38,-104);ctx.stroke();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(14,-103,3.5,0,7);ctx.arc(54,-103,3.5,0,7);ctx.fill();
    ctx.fillStyle='#3b1914';ctx.beginPath();ctx.ellipse(34,-76,18,13,0,0,7);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 17px sans-serif';ctx.fillText('FIGHTERS',-18,-8);ctx.font='bold 34px sans-serif';ctx.fillText('17',15,42);
    ctx.strokeStyle='#e4a06d';ctx.lineWidth=18;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-10,5);ctx.lineTo(40,22);ctx.stroke();ctx.beginPath();ctx.moveTo(110,5);ctx.lineTo(145,-5);ctx.stroke();
    ctx.translate(112,-8);ctx.fillStyle='#248bc0';ctx.beginPath();ctx.ellipse(42,20,86,32,0,0,7);ctx.fill();
    ctx.fillStyle='#d9edf3';ctx.beginPath();ctx.ellipse(66,30,51,14,0,0,7);ctx.fill();
    ctx.fillStyle='#175d82';ctx.beginPath();ctx.moveTo(-32,20);ctx.lineTo(-65,-3);ctx.lineTo(-56,20);ctx.lineTo(-65,43);ctx.closePath();ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(94,11,5,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.fillText('FIGHTERS',-8,25);
    ctx.fillStyle='#2a1510';ctx.beginPath();ctx.ellipse(116,22,17,14,0,0,7);ctx.fill();ctx.restore();
  }

  function getMuzzle(){return{x:player.x+228,y:player.y+muzzleYOffset}}
  function drawTarget(t){
    ctx.save();ctx.translate(t.x,t.y);ctx.fillStyle=t.type.color;ctx.beginPath();ctx.arc(0,0,t.r,0,7);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(0,0,t.r*.74,0,7);ctx.fill();
    ctx.strokeStyle='#17212b';ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,0,t.r*.92,0,7);ctx.stroke();
    ctx.fillStyle=t.type.color;ctx.font='bold '+Math.round(t.r*.9)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.type.symbol,0,1);
    if(t.maxHp>1){const bw=t.r*1.6,bh=6;ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(-bw/2,t.r+7,bw,bh);ctx.fillStyle='#fff';ctx.fillRect(-bw/2,t.r+7,bw*(t.hp/t.maxHp),bh)}
    ctx.restore();
  }
  function drawEgg(e){ctx.fillStyle='#f27b24';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.globalAlpha=.8;ctx.beginPath();ctx.arc(e.x-3,e.y-4,3,0,7);ctx.fill();ctx.globalAlpha=1}
  function shoot(){
    if(!running)return false;
    if(stamina<SHOT_COST){firing=false;status.textContent='スタミナ切れっす！ 少し待って回復するっす';return false}
    stamina-=SHOT_COST;refreshStamina();const m=getMuzzle();eggs.push({x:m.x,y:m.y,r:9,v:610});return true;
  }
  function spawn(){
    const type=targetTypes[Math.floor(Math.random()*targetTypes.length)];
    const r=(27+Math.random()*10)*type.size;
    const y=targetMinY+Math.random()*(targetMaxY-targetMinY);
    const base=92+Math.min(score*.28,100);
    targets.push({x:W+r,y,r,v:base*type.speed,type,hp:type.hp,maxHp:type.hp});
  }
  function burst(x,y,color){for(let i=0;i<12;i++){const a=Math.random()*Math.PI*2,s=40+Math.random()*145;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.42,color})}}
  function registerKill(t){combo++;comboTimer=COMBO_WINDOW;const gain=t.type.points*multiplier();score+=gain;scoreEl.textContent=score;refreshComboUI();floatTexts.push({x:t.x,y:t.y,text:'+'+gain,life:.75});status.textContent=t.type.label+'撃破！ '+combo+' COMBOっす'}
  function resetCombo(){if(combo>0){combo=0;refreshComboUI()}}

  function update(dt){
    player.y+=(player.targetY-player.y)*Math.min(1,dt*10);
    if(!firing&&stamina<MAX_STAMINA){stamina+=STAMINA_REGEN*dt;refreshStamina()}
    if(firing){lastShot+=dt;while(lastShot>=FIRE_INTERVAL){lastShot-=FIRE_INTERVAL;if(!shoot())break}}
    if(combo>0){comboTimer-=dt;if(comboTimer<=0){resetCombo();status.textContent='コンボが途切れたっす'}}
    spawnTime+=dt;if(spawnTime>Math.max(.45,1.02-score*.0011)){spawnTime=0;spawn()}
    eggs.forEach(e=>e.x+=e.v*dt);eggs=eggs.filter(e=>e.x<W+40);targets.forEach(t=>t.x-=t.v*dt);

    for(let i=targets.length-1;i>=0;i--){
      const t=targets[i];
      if(t.x-t.r<315){targets.splice(i,1);life--;lifeEl.textContent=life;resetCombo();status.textContent=t.type.label+'に突破されたっす！';if(life<=0){gameOver();return}continue}
      for(let j=eggs.length-1;j>=0;j--){
        const e=eggs[j],dx=e.x-t.x,dy=e.y-t.y;
        if(dx*dx+dy*dy<(e.r+t.r)*(e.r+t.r)){
          eggs.splice(j,1);t.hp--;burst(e.x,e.y,t.type.color);
          if(t.hp<=0){registerKill(t);targets.splice(i,1)}else{status.textContent=t.type.label+'に命中！ あと'+t.hp+'発っす'}
          break;
        }
      }
    }
    sparks.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=170*dt;p.life-=dt});sparks=sparks.filter(p=>p.life>0);
    floatTexts.forEach(f=>{f.y-=28*dt;f.life-=dt});floatTexts=floatTexts.filter(f=>f.life>0);
  }

  function draw(){
    drawBackground();drawHero();const m=getMuzzle();ctx.fillStyle='rgba(255,215,80,.5)';ctx.beginPath();ctx.arc(m.x,m.y,12,0,7);ctx.fill();
    eggs.forEach(drawEgg);targets.forEach(drawTarget);
    sparks.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/.42);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill()});ctx.globalAlpha=1;
    floatTexts.forEach(f=>{ctx.globalAlpha=Math.max(0,f.life/.75);ctx.fillStyle='#fff';ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y)});ctx.globalAlpha=1;ctx.textAlign='start';
    if(stamina<SHOT_COST){ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';ctx.font='bold 27px sans-serif';ctx.textAlign='center';ctx.fillText('🥚 スタミナ回復中…',W*.63,70);ctx.textAlign='start'}
  }

  function loop(t){if(!running)return;const dt=Math.min((t-last)/1000,.035);last=t;update(dt);draw();if(running)raf=requestAnimationFrame(loop)}
  function start(){
    cancelAnimationFrame(raf);running=true;score=0;life=3;combo=0;comboTimer=0;spawnTime=0;eggs=[];targets=[];sparks=[];floatTexts=[];firing=false;dragging=false;lastShot=0;stamina=MAX_STAMINA;player.y=215;player.targetY=215;
    scoreEl.textContent='0';lifeEl.textContent='3';refreshComboUI();refreshStamina();panelTitle.textContent='鮭イクラキャノン';panelText.innerHTML='長押しによる文字選択を防止したiPad対応版っす！';startBtn.textContent='ゲーム開始';menu.style.display='none';status.textContent='ゲーム開始っす！';last=performance.now();draw();raf=requestAnimationFrame(loop);
  }
  function gameOver(){
    running=false;firing=false;dragging=false;cancelAnimationFrame(raf);panelTitle.textContent='💥 ゲームオーバー';panelText.innerHTML='最終スコアは <b>'+score+'点</b>っす！<br>スタミナ配分を変えて再挑戦するっす';startBtn.textContent='もう一度遊ぶ';menu.style.display='flex';status.textContent='ゲームオーバーっす';
  }
  function canvasPos(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
  function beginFire(){if(!running)return;firing=true;lastShot=FIRE_INTERVAL}
  function endFire(){firing=false}

  document.addEventListener('contextmenu',e=>e.preventDefault());
  document.addEventListener('selectstart',e=>e.preventDefault());
  document.addEventListener('dragstart',e=>e.preventDefault());

  startBtn.addEventListener('click',start);
  fireBtn.addEventListener('pointerdown',e=>{e.preventDefault();beginFire()},{passive:false});
  fireBtn.addEventListener('pointerup',endFire);fireBtn.addEventListener('pointercancel',endFire);fireBtn.addEventListener('pointerleave',endFire);

  canvas.addEventListener('pointerdown',e=>{
    e.preventDefault();if(!running)return;
    if(canvas.setPointerCapture){try{canvas.setPointerCapture(e.pointerId)}catch(err){}}
    const p=canvasPos(e);dragging=true;if(p.x<400)player.targetY=clamp(p.y-muzzleYOffset,player.minY,player.maxY);beginFire();
  },{passive:false});

  canvas.addEventListener('pointermove',e=>{
    if(!dragging||!running)return;e.preventDefault();const p=canvasPos(e);if(p.x<400)player.targetY=clamp(p.y-muzzleYOffset,player.minY,player.maxY);
  },{passive:false});

  canvas.addEventListener('pointerup',e=>{
    dragging=false;endFire();if(canvas.releasePointerCapture){try{canvas.releasePointerCapture(e.pointerId)}catch(err){}}
  });
  canvas.addEventListener('pointercancel',()=>{dragging=false;endFire()});

  refreshComboUI();refreshStamina();draw();
})();
</script>
</body>
</html>
